<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transitions and Hover effects</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Transitions and Hover Effects</h1>
    </header>
    <main>
      <section class="section">
        <h2>Button Hover Effect</h2>
        <div class="btn-row">
          <button class="btn fill">Fill Effect</button>
          <button class="btn lift">Lift Effect</button>
          <button class="btn outline">Outline Effect</button>
          <button class="btn scale">Scale Effect</button>
        </div>
      </section>
      <!-- Cards Hover Effect -->
      <section class="section">
        <h2>Cards Hover Effect</h2>
        <div class="card-row">
          <div class="card lift-cd">Lift Card Effect</div>
          <div class="card glow-cd">Glow Shodow Effect</div>
          <div class="card border-cd">Border Appear Effect</div>
        </div>
      </section>
    </main>
  </body>
</html>
