<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Design and Media Queries</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">Zaven Builds</h1>
      <nav class="navlinks">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
      </nav>
      <button class="button">Hire Me</button>
    </header>
    <main>
      <section class="hero">
        <h2>Responsive Website</h2>
        <p>Resize the browser to see changes</p>
        <button class="hero-btn">Get Started</button>
      </section>
      <!-- CARDS SECTION -->
      <section class="card-section">
        <h2>Features</h2>
        <div class="cards">
          <!-- CARD 1 -->
          <div class="card">
            <div class="icon">⚡</div>
            <h3>Fast</h3>
            <p>Lightining Fast Perfomance</p>
          </div>
          <!-- CARD 2 -->
          <div class="card">
            <div class="icon">🔒</div>
            <h3>Secure</h3>
            <p>Enterprise grade security</p>
          </div>
          <!-- CARD 3 -->
          <div class="card">
            <div class="icon">📊</div>
            <h3>Analytics</h3>
            <p>Detailed insight and reports</p>
          </div>
        </div>
      </section>
    </main>
    <footer>&copy;Zaven Builds. All right reserved.</footer>
