<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learnin Css Grids</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>Learning Css Grids</header>
    <main>
      <!-- 3 Equal Columns -->
      <section class="section">
        <h2>3 Equal Coloumns</h2>
        <div class="grid-container">
          <div class="box">1</div>
          <div class="box">2</div>
          <div class="box">3</div>
          <div class="box">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
        </div>
      </section>
      <!-- Mixed columns -->
      <section class="section">
        <h2>Mixed Coloumns</h2>
        <div class="mix-grid">
          <div class="box">Side Bar</div>
          <div class="box">Main Content</div>
        </div>
      </section>
      <!-- Full Page Layout with Areas -->
      <section class="section">
        <h2>Full Page Layout with Areas</h2>
        <div class="grid-area">
          <div class="box" style="grid-area: header">Header</div>
          <div class="box" style="grid-area: sidebar">Side Bar</div>
          <div class="box" style="grid-area: main">Main Content</div>
          <div class="box" style="grid-area: footer">Footer</div>
        </div>
      </section>
      <!-- Auto Grids -->
      <section class="section">
        <h2>Auto Responsive Grids</h2>
        <div class="grid-auto">
          <div class="box">1</div>
          <div class="box">2</div>
          <div class="box">3</div>
          <div class="box">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
        </div>
      </section>
    </main>
  </body>
</html>
