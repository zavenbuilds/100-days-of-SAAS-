<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning FlexBox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div id="navlogo">Zaven</div>
      <nav id="navlinks">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
      <button id="hire">Hire Me</button>
    </header>
    <main>
      <section class="hero">
        <h1>Hello World</h1>
        <p>Today I am Learning FlexBox</p>
      </section>
      <section class="cards-section">
        <h2>Equal Width Cards</h2>
        <div class="cardsrow">
          <div id="card1">Card 1</div>
          <div id="card2">Card 2</div>
          <div id="card3">Card 3</div>
        </div>
      </section>
      <section class="examples">
        <h2>Justify Content Values</h2>
        <p>flexstart(default0)</p>
        <div class="start">
          <div id="item">1</div>
          <div id="item">2</div>
          <div id="item">3</div>
        </div>
        <p>center</p>
        <div class="center">
          <div id="item">1</div>
          <div id="item">2</div>
          <div id="item">3</div>
        </div>
        <p>space-between</p>
        <div class="space-between">
          <div id="item">1</div>
          <div id="item">2</div>
          <div id="item">3</div>
        </div>
        <p>space-evenly</p>
        <div class="space-evenly">
          <div id="item">1</div>
          <div id="item">2</div>
          <div id="item">3</div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
