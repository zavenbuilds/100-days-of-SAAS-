<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velora — Curated Essentials</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER / NAVIGATION -->
    <header>
      <div class="topbar">Free shipping on orders over $100</div>
      <!-- NAVBAR -->
      <nav class="nav container">
        <a class="logo" href="#">VELORA</a>
        <input class="menu-toggle" id="menu" type="checkbox" />
        <label class="menu-btn" for="menu">☰</label>
        <div class="nav-links">
          <a href="#new">New</a>
          <a href="#shop">Shop</a>
          <a href="#story">Our Story</a>
          <a href="#journal">Journal</a>
        </div>
        <div class="action">
          <a href="#">Search</a>
          <a href="#">Bag(0)</a>
        </div>
      </nav>
    </header>
    <!-- MAIN CONTENT -->
    <main>
      <!-- HERO SECTION -->
      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow">AUTUMN / WINTER 2026</span>
          <h1>Objects for a slower, better life.</h1>
          <p>
            Thoughtfully designed essentials for modern spaces. Quiet forms,
            honest materials and everyday functionality.
          </p>
          <a class="button" href="#shop">Explore collection →</a>
        </div>
        <div class="hero-img">
          <img
            alt="Minimal watch"
            src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&amp;fit=crop&amp;w=1200&amp;q=85"
          />
          <div class="note">
            <b>01 / 06</b>
            <span>Minimal Timepiece</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
